<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131417" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Echo Atlas: an unofficial Wuthering Waves fan hub. Not affiliated with Kuro Games." />
    <title>Echo Atlas</title>
    <script>
      // Apply the stored theme before first paint (FOUNDATIONS.md §8); 'system' leaves the attribute off.
      try {
        var t = localStorage.getItem('ea-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
